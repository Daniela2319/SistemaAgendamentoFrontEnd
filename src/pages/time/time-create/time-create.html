<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Agendamento - Cadastrar Horario Disponivel</title>
  <link rel="stylesheet" href="../../../reset.css">
  <link rel="stylesheet" href="../../../styles.css">

</head>

<body>
  <header>
    <nav>
      <ul class="menu">
        <li><a href="./../index.html">Home</a></li>
        <li><a href="./time-create.html">Cadastrar</a></li>
        <li><a href="./../time-list/time-list.html">Listar</a></li>

      </ul>
    </nav>
  </header>
  <main>
    <h1>Cadastrar Horario disponivel </h1>
    <form>
      <label>
        <input type="datetime-local" name="DataHoraInicio" placeholder="Digite a data e horario inicio"></input>
      </label><br>
      <label>
        <input type="datetime-local" name="DataHoraFim" placeholder="Digite a data e horario fim" />
      </label><br>
      <label for="profissionalId">Profissional:</label><br>
      <select name="profissionalId" id="profissionalId" required>
        <option value="">Selecione o profissional</option>

      </select><br><br>
      <button type="submit">Salvar</button>
      <button type="reset">Limpar</button>
    </form>
    <a href="./../index.html">Voltar</a>
  </main>
  <footer>
    <p>&copy; 2025 - Sistema Agendamento</p>
  </footer>
  <script type="module" src="./time-create.js"></script>
